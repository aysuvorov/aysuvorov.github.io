# Build the Next.js app as a static site and deploy it to GitHub Pages.
#
# Repo layout:
#   user.github.io            → served at https://user.github.io/         (basePath = "")
#   any other repo            → served at https://user.github.io/<repo>/  (basePath = "/<repo>")
#
# This workflow auto-detects which case applies from `GITHUB_REPOSITORY`
# (`owner/repo`) and feeds the right `NEXT_PUBLIC_BASE_PATH` into the build,
# so you don't have to hard-code the repo name anywhere in the source.
#
# Setup (one-time, per repo):
#   1. Push this repo to GitHub.
#   2. Repo → Settings → Pages → "Build and deployment" → Source = "GitHub Actions".
#   3. Push to `main` (or trigger manually) — the site goes live on the Pages URL.
#
# Notes:
#   - The template's package.json declares `packageManager: bun@1.3.14` and
#     ships `bun.lock`, so we install with Bun in CI too. This keeps the
#     dependency tree identical to local dev and avoids the "lock file not
#     found" error from `npm ci` (which needs `package-lock.json`).
#   - Bun is set up via `oven-sh/setup-bun@v2`, which also caches the global
#     Bun cache directory between runs.
#   - Node 24 is installed alongside Bun because `next build` may shell out
#     to Node for some tooling; matching the `engines.node` constraint in
#     package.json keeps behaviour predictable.
#   - `.nojekyll` lives in `public/` and is copied into `out/` by `next build`,
#     so Pages won't silently hide the `_next/` folder.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment; don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Pages base path
        id: basepath
        run: |
          # GITHUB_REPOSITORY is "owner/repo".
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          if [ "$REPO" = "$OWNER.github.io" ]; then
            echo "base_path=" >> "$GITHUB_OUTPUT"
            echo "Detected user/org GitHub Pages site → basePath=''"
          else
            echo "base_path=/$REPO" >> "$GITHUB_OUTPUT"
            echo "Detected project page → basePath='/$REPO'"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.base_path }}
        run: bun run build

      - name: Add .nojekyll (safety net)
        # `next build` already copies public/.nojekyll → out/.nojekyll, but we
        # touch it again in case a future Next version changes copy behaviour.
        run: touch out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
